name: Build diagnostic APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android scaffold
        run: |
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/stanryden/tg-ws-proxy-android/main/tg-ws-proxy-android-source-replacement.zip \
            -o /tmp/source.zip
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          test -d /tmp/source/tg-ws-proxy-android-app
          rsync -a --exclude='.github/' /tmp/source/tg-ws-proxy-android-app/ ./

      - name: Embed proxy core
        run: |
          mkdir -p app/src/main/python/proxy
          cp proxy/tg_ws_proxy.py app/src/main/python/proxy/tg_ws_proxy.py
          touch app/src/main/python/proxy/__init__.py

      - name: Enable persistent file logging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android.py")
          if not p.is_file():
              raise SystemExit("Expected root android.py was not found after scaffold extraction")
          s = p.read_text()
          if "from logging.handlers import RotatingFileHandler" not in s:
              s = s.replace("import logging", "import logging\nfrom logging.handlers import RotatingFileHandler", 1)
          replacement = '''def setup_logging(verbose: bool = False):
              _ensure_dirs()
              root = logging.getLogger()
              root.setLevel(logging.DEBUG if verbose else logging.INFO)
              root.handlers.clear()
              formatter = logging.Formatter(
                  "%(asctime)s %(levelname)s %(name)s: %(message)s",
                  datefmt="%Y-%m-%d %H:%M:%S",
              )
              level = logging.DEBUG if verbose else logging.INFO
              console = logging.StreamHandler(sys.stdout)
              console.setLevel(level)
              console.setFormatter(formatter)
              root.addHandler(console)
              file_handler = RotatingFileHandler(
                  APP_DIR / "proxy.log", maxBytes=1500000, backupCount=3, encoding="utf-8"
              )
              file_handler.setLevel(logging.DEBUG)
              file_handler.setFormatter(formatter)
              root.addHandler(file_handler)
              log.info("Persistent diagnostics enabled: %s", APP_DIR / "proxy.log")
          '''
          pattern = r"def setup_logging\(verbose: bool = False\):.*?(?=\ndef _run_proxy_thread\()"
          s2, n = re.subn(pattern, lambda _m: replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"Could not replace setup_logging() in {p}")
          p.write_text(s2)
          print("Persistent file logging enabled in", p)
          PY
      - name: Fix log path and export diagnostics
        run: |
          mkdir -p app/src/main/python
          cp android.py app/src/main/python/android.py
          echo "Packaged Android Python entrypoint:"
          grep -n "RotatingFileHandler\|Persistent diagnostics enabled" app/src/main/python/android.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/stanryden/tgwsproxy/MainActivity.java")
          s = p.read_text()
          # The Chaquopy Python HOME may be a subdirectory under filesDir; search for the actual log.
          s = s.replace(
              'File logFile = new File(new File(getFilesDir(), "TgWsProxy"), "proxy.log");',
              'File logFile = findProxyLog(getFilesDir());'
          )
          s = s.replace(
              'contents = "Файл логов не найден: " + logFile.getAbsolutePath()',
              'contents = "Файл proxy.log не найден в каталоге приложения: " + getFilesDir().getAbsolutePath()'
          )
          marker = "    private void shareLogs() {"
          helper = r"""
              private File findProxyLog(File root) {
                  File expected = new File(new File(root, "TgWsProxy"), "proxy.log");
                  if (expected.isFile() && expected.length() > 0) return expected;
                  File homeCandidate = new File(new File(new File(root, "home"), "TgWsProxy"), "proxy.log");
                  if (homeCandidate.isFile() && homeCandidate.length() > 0) return homeCandidate;
                  File[] children = root.listFiles();
                  if (children != null) {
                      for (File child : children) {
                          if (child.isDirectory()) {
                              File found = findProxyLogRecursive(child, 5);
                              if (found != null) return found;
                          }
                      }
                  }
                  return expected;
              }

              private File findProxyLogRecursive(File dir, int depth) {
                  if (depth < 0) return null;
                  File direct = new File(dir, "proxy.log");
                  if (direct.isFile() && direct.length() > 0) return direct;
                  File[] children = dir.listFiles();
                  if (children == null) return null;
                  for (File child : children) {
                      if (child.isDirectory()) {
                          File found = findProxyLogRecursive(child, depth - 1);
                          if (found != null) return found;
                      }
                  }
                  return null;
              }

          """
          if "private File findProxyLog(File root)" not in s:
              if marker not in s:
                  raise SystemExit("Cannot locate shareLogs() method")
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          print("Updated log discovery in", p)
          PY
          grep -n "findProxyLog\|Файл proxy.log не найден" app/src/main/java/com/stanryden/tgwsproxy/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-diagnostics-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
