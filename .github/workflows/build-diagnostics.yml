name: Build diagnostic APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android scaffold
        run: |
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/stanryden/tg-ws-proxy-android/main/tg-ws-proxy-android-source-replacement.zip \
            -o /tmp/source.zip
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          test -d /tmp/source/tg-ws-proxy-android-app
          rsync -a --exclude='.github/' /tmp/source/tg-ws-proxy-android-app/ ./

      - name: Embed proxy core
        run: |
          mkdir -p app/src/main/python/proxy
          cp proxy/tg_ws_proxy.py app/src/main/python/proxy/tg_ws_proxy.py
          touch app/src/main/python/proxy/__init__.py

      - name: Add diagnostics export button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/stanryden/tgwsproxy/MainActivity.java")
          s = p.read_text()
          s = s.replace("import android.widget.TextView;", "import android.widget.TextView;\nimport java.io.File;\nimport java.io.RandomAccessFile;\nimport java.io.IOException;")
          anchor = "        layout.addView(stop);"
          addition = """
                  Button logs = new Button(this);
                  logs.setText("Поделиться логами");
                  logs.setOnClickListener(v -> shareLogs());
                  layout.addView(logs);
          """
          if "Поделиться логами" not in s:
              if anchor not in s:
                  raise SystemExit("Cannot locate stop button insertion point")
              s = s.replace(anchor, anchor + addition, 1)
          method = r'''
              private void shareLogs() {
                  File logFile = new File(new File(getFilesDir(), "TgWsProxy"), "proxy.log");
                  String contents;
                  if (!logFile.isFile()) {
                      contents = "Файл логов не найден: " + logFile.getAbsolutePath()
                          + "\\nЗапустите прокси и повторите попытку.";
                  } else {
                      try (RandomAccessFile f = new RandomAccessFile(logFile, "r")) {
                          long length = f.length();
                          long start = Math.max(0, length - 120000);
                          f.seek(start);
                          byte[] bytes = new byte[(int)(length - start)];
                          f.readFully(bytes);
                          contents = "TG WS Proxy diagnostics (last " + bytes.length + " bytes)\\n"
                              + new String(bytes, java.nio.charset.StandardCharsets.UTF_8);
                          if (start > 0) contents = "[Начало файла обрезано; показан конец лога]\\n" + contents;
                      } catch (IOException e) {
                          contents = "Не удалось прочитать лог: " + e;
                      }
                  }
                  Intent send = new Intent(Intent.ACTION_SEND);
                  send.setType("text/plain");
                  send.putExtra(Intent.EXTRA_SUBJECT, "TG WS Proxy — диагностические логи");
                  send.putExtra(Intent.EXTRA_TEXT, contents);
                  startActivity(Intent.createChooser(send, "Отправить диагностические логи"));
              }
          '''
          if "private void shareLogs()" not in s:
              marker = "    @Override protected void onResume()"
              if marker not in s:
                  raise SystemExit("Cannot locate lifecycle method insertion point")
              s = s.replace(marker, method + "\\n" + marker, 1)
          p.write_text(s)
          print("Diagnostics export button inserted.")
          PY
          grep -n "Поделиться логами\|private void shareLogs" app/src/main/java/com/stanryden/tgwsproxy/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-diagnostics-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
