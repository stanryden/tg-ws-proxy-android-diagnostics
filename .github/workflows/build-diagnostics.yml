name: Build diagnostic APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android scaffold
        # Tip: replace "main" in the URL with a commit SHA of the scaffold
        # repository so that builds are reproducible.
        run: |
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/stanryden/tg-ws-proxy-android/main/tg-ws-proxy-android-source-replacement.zip \
            -o /tmp/source.zip
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          test -d /tmp/source/tg-ws-proxy-android-app
          rsync -a --exclude='.github/' /tmp/source/tg-ws-proxy-android-app/ ./

      - name: Embed proxy core
        run: |
          mkdir -p app/src/main/python/proxy
          cp proxy/tg_ws_proxy.py app/src/main/python/proxy/tg_ws_proxy.py
          touch app/src/main/python/proxy/__init__.py

      - name: Apply app overlay (Android bridge and UI)
        run: |
          set -euo pipefail
          test -f overlay/android_bridge.py
          test -f overlay/MainActivity.java
          BRIDGE="$(find app/src/main/python -name android_bridge.py | head -n 1)"
          MAIN="$(find app/src/main/java -name MainActivity.java | head -n 1)"
          test -n "$BRIDGE" || { echo "scaffold has no android_bridge.py"; exit 1; }
          test -n "$MAIN" || { echo "scaffold has no MainActivity.java"; exit 1; }
          cp overlay/android_bridge.py "$BRIDGE"
          cp overlay/MainActivity.java "$MAIN"
          echo "Overlay applied: $BRIDGE, $MAIN"
          # The bridge and the UI must be updated together.
          grep -q "def get_connection_info" "$BRIDGE"
          grep -q "get_connection_info" "$MAIN"
          grep -q "_setup_proxy_file_logging" "$BRIDGE"

      - name: Install launcher icon
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          encoded = Path("assets/ic_launcher.jpg.b64").read_text().strip()
          image = base64.b64decode(encoded, validate=True)
          if not image.startswith(bytes.fromhex("ffd8ff")):
              raise SystemExit("Launcher icon source is not a valid JPEG")
          # Android accepts JPEG launcher resources. Provide each density bucket.
          res = Path("app/src/main/res")
          for density in ("mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"):
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              # Avoid duplicate Android resources with the same name but different extensions.
              for previous in folder.glob("ic_launcher.*"):
                  previous.unlink()
              target = folder / "ic_launcher.jpg"
              target.write_bytes(image)
          manifest = Path("app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text()
              if 'android:icon="@mipmap/ic_launcher"' not in text:
                  text = text.replace('android:icon="@mipmap/ic_launcher_round"', 'android:icon="@mipmap/ic_launcher"')
                  manifest.write_text(text)
          print("Installed launcher icon in all mipmap density buckets")
          PY

      - name: Compile-check embedded Python sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          files = sorted(Path("app/src/main/python").rglob("*.py"))
          if not files:
              raise SystemExit("No embedded Python sources found")
          for source in files:
              py_compile.compile(str(source), doraise=True)
          print(f"Syntax OK: {len(files)} Python files")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-diagnostics-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/src/main/java/com/stanryden/tgwsproxy/MainActivity.java
            app/src/main/python/android_bridge.py
          if-no-files-found: error
          retention-days: 14